<!DOCTYPE html>
<html>
<head>
  <title>uhmb</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(16, 28px);
      gap: 5px;
      margin-top: 20px;
      user-select: none;
    }

    .cell {
      width: 28px;
      height: 28px;
      background: #212121;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.05s;
    }

    .cell.on {
      background: #ff0202;
      box-shadow: 0 0 6px #2a2a2a;
    }

    button {
      margin-top: 15px;
      padding: 8px 12px;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

  #authPanel {
  position: fixed;
  left: 10px;
  bottom: 10px;

  display: flex;
  flex-direction: column;
  gap: 2px;

  width: 100px;
  padding: 4px;


  font-size: 10px;
}

#authPanel input {
  width: 80%;
  padding: 4px;
  font-size: 10px;
  background: #1a1a1a;
  color: white;
  border: 1px solid #444;
  border-radius: 4px;
}
#authPanel button {
  padding: 5px;
  font-size: 10px;
  background: #333;
  color: white;
  border: 1px solid #555;
  border-radius: 4px;
  cursor: pointer;
}
#authPanel button:hover {
  background: #444;
}
#status {
  font-size: 11px;
  opacity: 0.8;
}
  </style>
</head>

<body>

<div id="authPanel">
  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="password">
  <button id="loginBtn">login</button>
  <div id="status">logged in't</div>
</div>
<div class="grid" id="grid"></div>

<button id="clearBtn">Clear</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCkjHTbcxY5Xnv_vr1GvOZoI7Q5juQBl-U",
  databaseURL: "https://pixelpost-b0450-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let frame = Array(16).fill(0);
const grid = document.getElementById("grid");
let isMouseDown = false;
let paintMode = 1;
const cells = [];

let isAuthed = false;

function encodeFrame(arr) {
  let binary = "";
  for (let i = 0; i < arr.length; i++) {
    binary += String.fromCharCode(arr[i] & 0xff);
  }
  return btoa(binary);
}

function decodeFrame(str) {
  const binary = atob(str);
  const out = [];
  for (let i = 0; i < binary.length; i++) {
    out.push(binary.charCodeAt(i));
  }
  return out;
}

for (let y = 0; y < 8; y++) {
  for (let x = 0; x < 16; x++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    const mask = (1 << (7 - y));
    function apply() {
      const isOn = (frame[x] & mask) !== 0;
      cell.classList.toggle("on", isOn);
    }

    function toggle() {
      if (paintMode === 1) 
        frame[x] |= mask;
      else
        frame[x] &= ~mask;
      
      apply();
    }

    cell.addEventListener("mousedown", () => {
      if (!isAuthed) return;
      isMouseDown = true;
      paintMode = (frame[x] & mask) ? 0 : 1;
      toggle();
    });

    cell.addEventListener("mouseenter", () => {
      if (!isAuthed) return;
      if (isMouseDown) toggle();
    });

    cells.push({ apply });
    grid.appendChild(cell);
  }
}

window.addEventListener("mouseup", () => {
  isMouseDown = false;
  pushFrame(); 
});


function pushFrame() {
  if (!isAuthed) return;
  set(ref(db, "frame"), encodeFrame(frame));
}

async function loadFrame() {
  if (!isAuthed) return;
  const snapshot = await get(ref(db, "frame"));

  if (!snapshot.exists()) return;

  const encoded = snapshot.val();
  frame = decodeFrame(encoded);

  render();
}

function render() {
  for (const c of cells) c.apply();
}

document.getElementById("clearBtn").onclick = () => {
  frame = Array(16).fill(0);
  render();
  pushFrame();
};

onAuthStateChanged(auth, (user) => {
  isAuthed = !!user;

  if (user) {
    document.getElementById("authPanel").style.display = "none"; 
    loadFrame();
  }
  else 
    document.getElementById("status").textContent = "logged in't";
  
});

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    document.getElementById("status").textContent = "failed";
  }
};

loadFrame();

</script>

</body>
</html>
